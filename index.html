<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>京都・伊根 六天五夜</title>
<meta name="theme-color" content="#23406B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="京都旅行">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
:root{
  --kyo:#23406B;      /* 京藍 */
  --torii:#D9482F;    /* 鳥居朱紅 */
  --lantern:#F2B441;  /* 燈籠黃 */
  --ume:#E58FA6;      /* 梅花粉 */
  --matcha:#2F7D6B;   /* 抹茶綠 */
  --snow:#7FB9D6;     /* 淺雪藍 */
  --bg:#EEF4F3;
  --muted:#4F6385;
  --t-sight:#DDEEF7; --t-food:#FDF0CC; --t-shop:#FBE1E8; --t-neutral:#F2F4F5;
  --line:1.5px solid var(--kyo); --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--kyo);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Source Han Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:16px;line-height:1.75;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
a{color:var(--kyo)}
button,input,textarea{font:inherit;color:inherit}
.card{background:#fff;border:var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}

/* ===== Hero ===== */
.hero{background:#fff;border:var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.scene{display:block;width:100%;height:auto;border-bottom:var(--line)}
.hero-body{padding:14px 16px 16px}
/* ===== Mini Me 旅行隊伍：由右往左，導遊走最前面 ===== */
.hero-scene{position:relative;width:100%;overflow:hidden;container-type:inline-size}
.hero-scene .scene{border-bottom:0}
.mini-parade{position:absolute;left:0;bottom:1%;width:100%;height:56%;overflow:hidden;pointer-events:none;z-index:5}
.mini-parade-track{position:absolute;left:0;bottom:0;height:100%;width:max-content;display:flex;flex-direction:row;align-items:flex-end;gap:5px;will-change:transform;animation:mini-travel 30s linear infinite}
.mini-parade-track img{display:block;width:auto;max-width:none;flex:0 0 auto;transform-origin:50% 100%;animation:mini-step .66s ease-in-out infinite alternate}
.mini-parade-track img:nth-child(1){height:82%;animation-delay:0s}
.mini-parade-track img:nth-child(2){height:79%;animation-delay:-0.3s}
.mini-parade-track img:nth-child(3){height:76%;animation-delay:-0.54s}
.mini-parade-track img:nth-child(4){height:76%;animation-delay:-0.18s}
.mini-parade-track img:nth-child(5){height:79%;animation-delay:-0.42s}
@keyframes mini-travel{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
@supports (width:1cqw){@keyframes mini-travel{from{transform:translateX(100cqw)}to{transform:translateX(-100%)}}}
@keyframes mini-step{from{translate:0 0;rotate:-1.6deg}to{translate:0 -3%;rotate:1.6deg}}
@media(prefers-reduced-motion:reduce){.mini-parade-track,.mini-parade-track img{animation:none}.mini-parade-track{left:4%}}

.hero h1{font-size:26px;line-height:1.3;font-weight:700;letter-spacing:.02em}
.hero .sub{margin-top:4px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;border:var(--line);background:#fff;font-size:14px;line-height:1.7}
.cd{text-align:center;margin-top:12px;border:var(--line);border-radius:12px;padding:10px 12px;background:var(--t-sight)}
.cd-l{font-size:15px;font-weight:500}
.cd-n{font-size:18px}
.cd-n b{font-size:30px;font-weight:700;color:var(--torii);padding:0 2px}
.cd-s{font-size:15px;margin-top:2px}
.cd-w{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:16px;margin-top:6px}
.cd-w .tg{margin:0}
.cd details{margin-top:8px;text-align:left}
.cd summary{cursor:pointer;font-weight:700;font-size:16px;text-align:center;min-height:32px;display:flex;align-items:center;justify-content:center;gap:6px;list-style:none}
.cd summary::-webkit-details-marker{display:none}
.cd summary::after{content:"▾";font-size:14px}
.cd details[open] summary::after{content:"▴"}
.cd-sec{font-weight:700;font-size:15px;margin:8px 0 2px;color:var(--kyo)}
.cd ul{margin:0;padding-left:1.2em;font-size:15px;line-height:1.55}
.cd li.nx{font-weight:700;color:var(--torii)}

/* ===== Nav ===== */
.nav[hidden]{display:none}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.navbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border:var(--line);border-radius:16px;background:#fff;font-weight:700;font-size:17px;cursor:pointer;padding:8px 10px}
.navbtn svg{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navbtn.on{background:var(--kyo);color:#fff}
.navbtn:active{transform:scale(.98)}

/* ===== Tags ===== */
.tg{display:inline-block;font-size:14px;line-height:1.6;padding:0 8px;border-radius:999px;margin-left:6px;vertical-align:middle;font-weight:500;white-space:nowrap}
.tg.must{background:var(--torii);color:#fff}
.tg.tbc{background:var(--lantern);color:var(--kyo)}
.tg.ex{background:#fff;border:1.5px dashed var(--kyo)}
.tg.mid{background:var(--snow);color:var(--kyo)}
.tg.pri{background:var(--kyo);color:#fff}
.tg.ok{background:var(--matcha);color:#fff}
.tg.award{background:#f4ead2;color:#684b18;border:1px solid #d9c18e}
.scoreline{font-size:13px;color:var(--muted);margin:3px 0 7px;line-height:1.55}

/* ===== Section title ===== */
.stitle{font-size:20px;font-weight:700;margin:4px 2px 10px}
.stitle small{font-size:15px;font-weight:400;margin-left:6px}

/* ===== Day buttons ===== */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dbtn{min-height:64px;border:var(--line);border-radius:14px;background:#fff;cursor:pointer;padding:6px 4px;text-align:center;line-height:1.35}
.dbtn b{display:block;font-size:19px}
.dbtn span{display:block;font-size:14px}
.dbtn i{display:block;font-style:normal;font-size:13px;color:var(--torii);font-weight:700}
.dbtn.on{background:var(--kyo);color:#fff}
.dbtn.on i{color:var(--lantern)}

/* ===== Sticky summary ===== */
.sticky{position:sticky;top:8px;z-index:30;padding:8px 12px;margin-bottom:12px}
.sum-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px}
.sum-row .ic{font-size:26px;line-height:1}
.sum-row .tp{font-weight:700;font-size:17px}
.sum-top{display:flex;align-items:center;gap:8px}
.sum-left{flex:1;min-width:0}
.sum-btn{flex:none;margin-left:0;min-height:44px;padding:0 12px;border:var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:500}
.sum-more{border-top:1.5px dashed var(--snow);margin-top:6px;padding-top:8px;font-size:16px}
.sum-more p{margin:0 0 6px}
.warn{background:var(--lantern);border-radius:10px;padding:2px 10px;font-weight:700;font-size:15px}
.warn.wl{display:block;width:fit-content;max-width:100%;margin-top:6px;padding:5px 10px;font-size:14px;line-height:1.5}
.sum-more .bl{margin:0 0 8px}

/* ===== Day header ===== */

.fest{position:relative;overflow:hidden;margin:0 0 12px;padding:14px 16px 14px 18px;border:2.5px solid #23406B;border-radius:18px;background:linear-gradient(135deg,#FFF3DC,#FBE0D6);box-shadow:4px 4px 0 rgba(35,64,107,.16);min-height:88px}
.fest svg.fl{position:absolute;left:8px;top:6px;width:84px;height:100px}
.fest svg.fr{position:absolute;right:10px;top:50%;margin-top:-34px;width:68px;height:68px;transform:rotate(-8deg)}

.fest b{display:block;font-size:19px;color:#B3321F;letter-spacing:.06em;padding-right:84px}
.fest>span{display:block;font-size:15px;color:#51668a;line-height:1.55;margin-top:3px;padding-right:84px}
.dayhead{margin:0 2px 10px}
.dayhead h2{font-size:21px;line-height:1.4}
.dayhead .meta{font-size:15px}
.info{background:var(--t-neutral);border:var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:16px}
.info p{margin:0 0 4px}
.info p:last-child{margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:#fff}
.seg button{min-height:48px;border:0;background:#fff;cursor:pointer;font-weight:700;font-size:16px}
.seg button+button{border-left:var(--line)}
.seg button.on{background:var(--kyo);color:#fff}

/* ===== Timeline cards ===== */
.tl{position:relative}
.it{border:var(--line);border-radius:var(--r);padding:12px 14px;margin:0;background:var(--t-neutral)}
.it.sight{background:var(--t-sight)}
.it.food{background:var(--t-food)}
.it.shop{background:var(--t-shop)}
.it .top{display:flex;align-items:center;flex-wrap:wrap;gap:2px 0;font-size:15px}
.it .time{font-weight:700;font-size:17px}
.it .kind{margin-left:8px;font-size:14px;border:var(--line);border-radius:999px;padding:0 8px;background:#fff}
.it h3{font-size:19px;line-height:1.45;margin:4px 0 2px}
.it .stay{font-size:15px;font-weight:500}
.it .d{margin:4px 0 6px}
.row{display:grid;grid-template-columns:5.2em 1fr;gap:8px;font-size:16px;margin:3px 0;padding-top:4px;border-top:1.5px dashed rgba(35,64,107,.25)}
.row b{font-weight:700}
.orig{font-size:15px;margin-bottom:2px;text-decoration:line-through;opacity:.7}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.ckl input{width:24px;height:24px;accent-color:var(--matcha);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border:var(--line);border-radius:12px;background:#fff;text-decoration:none;font-weight:700;font-size:16px;cursor:pointer}
.btn.fill{background:var(--kyo);color:#fff}
.btn.pri{background:var(--torii);border-color:var(--torii);color:#fff}
.btn.sm{min-height:44px}
.btn:active{transform:scale(.98)}
.btn .i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Transit ===== */
.tr{margin:0 0 0 16px;padding:8px 10px 8px 14px;border-left:3px dashed var(--snow);font-size:16px;line-height:1.6}
.tr .m{font-weight:700}
.tr .w{display:block;font-size:15px}
.tr .nt{display:block;font-size:15px}
.tr.alert{border-left-color:var(--torii)}
.gap{height:10px}

/* ===== Boarding pass ===== */
.bp{background:#fff;border:var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.bp-top{display:flex;justify-content:space-between;align-items:center;background:var(--kyo);color:#fff;padding:8px 14px;font-weight:700;font-size:15px}
.bp-main{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:12px 14px 4px}
.bp-pt .code{font-size:34px;font-weight:700;line-height:1.1}
.bp-pt .nm{font-size:15px}
.bp-pt .tm{font-size:26px;font-weight:700;line-height:1.2;color:var(--torii)}
.bp-pt .tz{font-size:14px}
.bp-pt.r{text-align:right}
.bp-mid{text-align:center;font-size:14px}
.bp-mid .plane{font-size:26px;line-height:1}
.bp-cut{border-top:2px dashed var(--kyo);margin:10px 0 0;position:relative}
.bp-cut::before,.bp-cut::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:var(--line)}
.bp-cut::before{left:-10px}.bp-cut::after{right:-10px}
.bp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px 14px 4px}
.bp-grid div small{display:block;font-size:14px;opacity:.8;line-height:1.4}
.bp-grid div b{font-size:17px}
.bpi{border:var(--line);border-radius:10px;min-height:40px;width:100%;padding:0 8px;font-size:16px;background:#fff}
.barcode{display:block;width:70%;height:28px;margin:8px 14px 14px}

/* ===== Lists / forms ===== */
.prog{height:14px;border:var(--line);border-radius:999px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--matcha);width:0;transition:width .4s ease}
.ck{display:flex;align-items:flex-start;gap:4px;border-top:1.5px dashed rgba(35,64,107,.25);padding:2px 0}
.ck:first-of-type{border-top:0}
.ckl{display:flex;gap:10px;align-items:flex-start;flex:1;min-height:48px;padding:10px 0;cursor:pointer}
.ckl .txt{flex:1}
.ckl small{display:block;font-size:15px;opacity:.85;line-height:1.55}
.ck.is-done .txt{text-decoration:line-through;opacity:.6}
.ck .x{width:44px;height:44px;border:0;background:transparent;font-size:18px;cursor:pointer;flex:none}
.add{display:flex;gap:8px;margin-top:8px}
.add input,.fld input,.exp-f input,textarea{border:var(--line);border-radius:12px;background:#fff;padding:0 12px;min-height:46px;width:100%;font-size:16px}
textarea{padding:10px 12px;min-height:90px}
.fld{display:block;margin:0 0 10px}
.fld span{display:block;font-size:15px;font-weight:500}
.exp-f{display:grid;grid-template-columns:1fr 7.5em auto;gap:8px;margin:8px 0}
.exp-i{display:flex;align-items:center;gap:8px;border-top:1.5px dashed rgba(35,64,107,.25);min-height:46px}
.exp-i span:first-child{flex:1}
.exp-i button{width:44px;height:44px;border:0;background:transparent;font-size:18px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl td{padding:6px 4px;border-top:1.5px dashed rgba(35,64,107,.25);vertical-align:top}
.tbl td:last-child{text-align:right;white-space:nowrap}
.tbl tr:first-child td{border-top:0}
.tot td{font-weight:700;border-top:var(--line)!important}
/* 預算：手機版面 */
.bx-hero{background:linear-gradient(135deg,#23406b,#2f5a8f);color:#fff;border-radius:18px;padding:18px 16px;text-align:center;margin-bottom:14px}
.bx-hero .l{font-size:15px;opacity:.9}
.bx-hero .big{font-size:38px;font-weight:800;line-height:1.15;margin:4px 0}
.bx-hero .s{font-size:16px;opacity:.95}
.bx-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bx-tile{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 8px}
.bx-tile .l{font-size:13px;opacity:.9}
.bx-tile .v{font-size:17px;font-weight:700;margin-top:2px}
.bx-note{font-size:14px;line-height:1.6;margin-top:12px;opacity:.95;text-align:left}
.bx-list{display:flex;flex-direction:column;gap:10px}
.bx-row{border:1.5px solid rgba(35,64,107,.2);border-radius:14px;padding:10px 12px;background:#fff}
.bx-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:16px;line-height:1.35}
.bx-top .tg{margin:0}
.bx-amt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px}
.bx-amt b{font-size:18px}
.bx-amt span{font-size:14px;opacity:.75}
.bx-bar{height:6px;border-radius:3px;background:rgba(35,64,107,.12);margin-top:8px;overflow:hidden}
.bx-bar i{display:block;height:100%;border-radius:3px}
.bx-sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:12px 4px 0;font-weight:700}
.bx-sum b{font-size:20px}
.bx-sub{font-size:14px;opacity:.8;margin-top:6px;line-height:1.55}
.bx-rate{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:15px}
.bx-rate input{width:110px;min-height:44px;font-size:17px;text-align:center;border:1.5px solid rgba(35,64,107,.35);border-radius:10px;padding:0 8px;background:#fff;color:inherit}

.kv{display:grid;grid-template-columns:6.5em 1fr;gap:4px 10px;margin:0}
.kv dt{font-weight:700}
.kv dd{margin:0}
.acc{border:var(--line);border-radius:12px;margin:0 0 8px;background:#fff}
.acc summary{min-height:48px;padding:10px 12px;font-weight:700;cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"＋";float:right}
.acc[open] summary::after{content:"－"}
.acc .in{padding:0 12px 10px}
.acc.shopc{background:var(--t-shop)}
.acc.sightc{background:var(--t-sight)}
.acc.foodc{background:var(--t-food)}
.acc ul,.in ul{margin:4px 0;padding-left:1.2em}
.back{display:flex;margin:18px auto 0;min-height:56px;width:100%}
.foot{font-size:15px;margin-top:16px;opacity:.85}

.days.f4 .dbtn.all{grid-column:1/-1;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 12px;border:1.5px solid rgba(35,64,107,.22);background:linear-gradient(135deg,#fff 0%,#f3f7fa 100%);box-shadow:0 3px 10px rgba(35,64,107,.08)}
.days.f4 .dbtn.all b{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;line-height:1.2}
.days.f4 .dbtn.all span{display:block;font-size:13px;line-height:1.2;letter-spacing:.08em;opacity:.78}
.days.f4 .dbtn.all.on{background:var(--kyo);border-color:var(--kyo);color:#fff;box-shadow:0 4px 12px rgba(35,64,107,.2)}
/* 預約餐廳：精緻日曆勾選圖示，全部清單置於標題正下方 */
.days.f4 .dbtn.all b svg{width:23px;height:23px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rv-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rv-h h3{font-size:19px}
.rv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:12px 0;border-top:1.5px dashed rgba(35,64,107,.3)}
.rv:first-of-type{border-top:0}
.rv>input[type=checkbox]{width:30px;height:30px;accent-color:var(--matcha);margin-top:3px}
.rv .nm{font-size:18px;font-weight:700;line-height:1.45}
.rv.is-done .nm{text-decoration:line-through;opacity:.6}
.rv .bd{grid-column:1/-1}
.rv .rg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 10px;margin-top:8px}
.rv .rg>label{min-width:0}
.rv input[type=date],.rv input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:46px;padding:0 12px}
.rv input::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.rv input::-webkit-calendar-picker-indicator{margin:0}
.rv .rg label{display:block;font-size:14px;font-weight:600;color:#51668a}
.rv .rg label.open textarea{min-height:60px}
.rv .rg .full{grid-column:1/-1}
.rv input[type=date],.rv input[type=time],.rv input[type=text],.rv input[type=url],.rv textarea{border:var(--line);border-radius:12px;background:#fff;padding:0 10px;min-height:46px;width:100%;font-size:16px;margin-top:2px}
.rv textarea{padding:8px 10px;min-height:140px;line-height:1.6;resize:vertical}
.rv-add{border-top:var(--line);margin-top:6px;padding-top:12px}
.opt{border-top:1.5px dashed rgba(35,64,107,.25);margin-top:10px;padding-top:8px}
.opt.f{border-top:0;margin-top:4px;padding-top:0}
.opt h3{font-size:18px;line-height:1.45;margin:0 0 2px}
.resc .rtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.resc .rtop b{font-size:18px}
.resc .rtop .tg{margin:0}
.resc .rnote{font-size:15px;margin:2px 0 0}
.resc .rg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:8px}
.resc .rg>label{min-width:0}
.resc .rg label{display:block;font-size:15px;font-weight:500}
.resc .rg .full{grid-column:1/-1}
.resc input,.resc textarea{border:var(--line);border-radius:12px;background:#fff;padding:0 10px;min-height:46px;width:100%;font-size:16px;margin-top:2px}




/* ===== 底部快速列／折疊卡片／下一站／焦點 ===== */
.sticky{position:static!important}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:50;width:100%;max-width:640px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.96);border-top:1px solid rgba(255,255,255,.7);padding:6px 10px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(35,64,107,.10)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.bnav{background:rgba(255,255,255,.68);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px)}}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:52px;border:0;border-radius:12px;background:transparent;color:var(--kyo);font:inherit;font-weight:700;font-size:13px;line-height:1.3;cursor:pointer}
.bnav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on{background:var(--kyo);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #F2B441;outline-offset:2px;box-shadow:0 0 0 1px var(--kyo)}
.it.fold:not(.open) .more{display:none}
.it.fold .d-f{display:none}
.it.fold.open .d-f{display:block}
.it.fold.open .d-s{display:none}
.it.fold:not(.open) .d-s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.expall{display:flex;justify-content:flex-end;margin:0 0 10px}
.expall .btn{min-height:40px;padding:4px 14px;font-size:15px}
.nu .nu-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.nu .nu-h b{font-size:18px}
.nu-i{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:2px 8px;padding:8px 0;border-top:1.5px dashed rgba(35,64,107,.25)}
.nu-i:first-of-type{border-top:0}
.nu-k{font-size:13px;font-weight:700;color:#fff;background:var(--kyo);border-radius:8px;padding:0 8px;display:inline-block;margin-right:6px}
.nu-t{font-weight:700;color:var(--kyo);line-height:1.5}
.nu-n{font-weight:700;line-height:1.5}
.nu-m{grid-column:2;font-size:15px;display:inline-block;min-height:40px;padding:8px 0;font-weight:700}
.rv .nm{cursor:pointer}
@media (max-width:480px){.tg{font-size:13px!important}.scoreline{font-size:13px!important}}

/* ===== 長文字分段 / 條列 ===== */
.bl{margin:0;padding:0;list-style:none}
.bl li{position:relative;padding-left:1.05em;margin:0 0 5px;line-height:1.65}
.bl li:last-child{margin-bottom:0}
.bl li::before{content:"";position:absolute;left:.1em;top:.72em;width:.42em;height:.42em;border-radius:50%;background:rgba(35,64,107,.5)}
.ln{display:block;margin:0 0 6px}
.ln:last-child{margin-bottom:0}
.rt{display:block;font-weight:700;line-height:1.5}
.rd{display:block;margin-top:2px;color:var(--muted);font-size:.94em;line-height:1.6}
.rd .ln{margin:0 0 2px}
.tr .nt .bl,.tr .w .bl{margin-top:3px}
.bl li b.lk{display:block;font-weight:700}
.bl li.gh{padding-left:0;margin:8px 0 4px;font-weight:700;color:var(--kyo)}
.bl li.gh:first-child{margin-top:0}
.bl li.gh::before{display:none}
.bl li.gh span{display:inline-block;background:rgba(35,64,107,.1);border-radius:8px;padding:0 8px}
.bl li .lv{display:block;color:var(--ink,inherit)}
.olink{color:var(--kyo);font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:rgba(35,64,107,.4)}
.row a.lnk{display:inline-block;margin:2px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ===== 長字串與手機閱讀排版 ===== */
.wrap,.card,.it,.opt,.row,.row b,.row span,.info,.tr,.kv,.kv dt,.kv dd,
.resc,.resc label,.resc .rnote,.scoreline,.d,.nt,.foot{
  min-width:0;
  overflow-wrap:anywhere;
  word-break:normal;
}
.row{grid-template-columns:5.9em minmax(0,1fr)}
.row>*{min-width:0}
.opt-title{min-width:0;overflow-wrap:anywhere}
a{overflow-wrap:anywhere;word-break:normal}

/* ===== 手機優先：餐廳選項與標籤 ===== */
.opt-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opt-badges{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
.opt-badges .tg{margin:0}
.pick-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:25px;height:25px;border:0;background:transparent;color:#d99a18;vertical-align:-5px;filter:drop-shadow(0 1px 1px rgba(126,82,8,.22))}
.pick-icon svg{width:22px;height:22px;display:block;fill:currentColor}
.opt-title .pick-icon{margin-left:2px}
.it .row b{white-space:nowrap}
.it .row b .pick-icon{margin-left:2px;width:18px;height:18px}
.it .row b .pick-icon svg{width:17px;height:17px}
.pick-icon[aria-label]{cursor:help}
.it .row,.opt .row{grid-template-columns:5.9em minmax(0,1fr)}
@media(max-width:480px){
 .wrap{padding:8px 10px calc(92px + env(safe-area-inset-bottom))}
 .card,.it{padding:12px}
 .it{border-radius:14px}
 .it .top{gap:5px 0}
 .it .time{font-size:16px}
 .it h3{font-size:18px}
 .row,.it .row,.opt .row{grid-template-columns:5.9em minmax(0,1fr);gap:6px;font-size:15px;line-height:1.65}
 .opt{margin-top:9px;padding-top:8px}
 .opt-title{font-size:17px;line-height:1.4;gap:7px}
 .pick-icon{width:22px;height:22px;border-radius:7px}
 .scoreline{font-size:12px;line-height:1.55;overflow-wrap:anywhere}
 .tg{font-size:12px;padding:1px 7px;line-height:1.55;margin-left:3px;white-space:normal}
 .opt-badges .tg{margin:0}
 .days{gap:6px}
 .dbtn{min-height:58px}
 .navbtn{min-height:58px;font-size:16px}
}

/* ===== Motion ===== */
.pop{animation:pop .45s cubic-bezier(.34,1.4,.64,1) both;animation-delay:calc(var(--i,0)*55ms)}
.snowf{fill:#fff;animation:fall var(--t,9s) linear var(--d,0s) infinite}
@keyframes fall{0%{transform:translate(0,-12px)}100%{transform:translate(-8px,235px)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.flame.b{animation-duration:2.1s;animation-delay:-.6s}
.flame.c{animation-duration:1.3s;animation-delay:-.3s}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.94,1.1)}70%{transform:scale(1.05,.95)}}
.glow{animation:glow 3.2s ease-in-out infinite}
.glow.b{animation-delay:-1.4s}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.rip{animation:rip 5s ease-in-out infinite alternate}
.rip.b{animation-duration:6.5s;animation-delay:-2s}
@keyframes rip{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .snowf{display:none}
}
</style>

  const D=DAYS[day-1],j=jstNow(),nowMin=j.h*60+j.mi;
  let nx=null;for(const it of D.items){if(it.k==="tr")continue;const t=parseStart(it.t);if(t!=null&&t>nowMin){nx=it;break}}
  const live=wxGet(D.n),w=live||WEATHER[D.n];
  const list=D.items.filter(it=>it.k!=="tr").map(it=>'<li'+(it===nx?' class="nx"':'')+'>'+esc(it.t)+'　'+esc(it.n)+(it===nx?'（下一個）':'')+'</li>').join("");
  const notes=(D.info||[]).map(x=>'<li>'+esc(x)+'</li>').join("")+(w.alert?'<li>'+esc(w.alert)+'</li>':'');
  return '<div class="cd-l">旅行中・日本時間</div><div class="cd-n">第 <b>'+day+'</b> 天 <span style="font-size:16px">'+D.date+'（'+D.wd+'）'+esc(D.title)+'</span></div>'+

}
function tick(){
  const el=$("#cd");if(!el)return;
  const start=Date.parse(TRIP.start),now=Date.now();
  if(now<start){
    const s=Math.floor((start-now)/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
    setCd(el,'<div class="cd-l">距離出發（2/2 06:55 高雄起飛）</div><div class="cd-n"><b>'+d+'</b>天 <b>'+h+'</b>時 <b>'+m+'</b>分</div><div class="cd-s">節分祭典等你來</div>');
    return}
  const day=tripDay();
  if(day>=1&&day<=6)setCd(el,dayBrief(day));

const WX_KEY="kyoto2027_wx";
const KY={n:"京都",lat:35.0116,lon:135.7681};
const WX_LOC={1:[KY],2:[KY],3:[{n:"伊根",lat:35.6745,lon:135.2870},{n:"美山",lat:35.30,lon:135.57}],4:[KY],5:[{n:"大阪",lat:34.6937,lon:135.5023}],6:[KY]};
let WX=(()=>{try{return JSON.parse(localStorage.getItem(WX_KEY)||"null")||{}}catch(e){return {}}})();
function wxIcon(c,snow){
  if(snow>0||[71,73,75,77,85,86].includes(c))return"🌨️";
  if(c===0)return"☀️";if(c===1||c===2)return"⛅";if(c===3)return"☁️";if(c===45||c===48)return"🌫️";
  if(c>=51&&c<=57)return"🌦️";if(c>=61&&c<=67||c>=80&&c<=82)return"🌧️";if(c>=95)return"⛈️";return"☁️";
}
const wxInWindow=()=>Date.now()>=Date.parse(TRIP.start)-17*864e5;
async function refreshWx(force){
  if(!wxInWindow())return;
  if(!force&&WX.t&&Date.now()-WX.t<3*36e5&&WX.days)return;
  const uniq={};Object.values(WX_LOC).flat().forEach(l=>{uniq[l.lat+","+l.lon]=l});
  const res={};
  await Promise.all(Object.keys(uniq).map(async k=>{
    const l=uniq[k];
    const u="https://api.open-meteo.com/v1/forecast?latitude="+l.lat+"&longitude="+l.lon+"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,snowfall_sum&timezone=Asia%2FTokyo&forecast_days=16";
    const r=await fetch(u);if(!r.ok)throw new Error("wx "+r.status);
    res[k]=(await r.json()).daily;
  }));
  const days={};
  for(const n of Object.keys(WX_LOC)){
    const date="2027-02-0"+(+n+1),locs=[];
    WX_LOC[n].forEach(l=>{const d=res[l.lat+","+l.lon];const i=d?d.time.indexOf(date):-1;
      if(i>=0)locs.push({n:l.n,hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i]),p:d.precipitation_probability_max[i]||0,snow:d.snowfall_sum[i]||0,code:d.weather_code[i]})});
    if(locs.length)days[n]=locs;
  }
  if(Object.keys(days).length){WX={t:Date.now(),days};try{localStorage.setItem(WX_KEY,JSON.stringify(WX))}catch(e){}}
}
function wxGet(n){
  const L=WX.days&&WX.days[n];if(!L)return null;
  const base=WEATHER[n];
  const hi=Math.max(...L.map(x=>x.hi)),lo=Math.min(...L.map(x=>x.lo)),p=Math.max(...L.map(x=>x.p)),snow=L.reduce((a,x)=>a+x.snow,0);
  let wear=base.wear;
  if(lo<=0)wear+=" 預報最低溫在 0°C 以下，請加強保暖並注意路面結冰。";
  if(p>=60)wear+=" 降雨／降雪機率偏高，請備好雨具或防水外套。";
  return{i:wxIcon(L[0].code,snow),hi,lo,p,u:snow>0?"降雪":"降雨",wear,alert:base.alert,live:true,locs:L,t:WX.t};
}

const PACK_DAYS=10;

const packWxOn=()=>Date.now()>=packStart().getTime()&&!!(WX.days&&Object.keys(WX.days).length);
function packWx(){
  if(!packWxOn())return null;

  if(!rows.length)return null;
  const minLo=Math.min(...rows.map(r=>r.lo)),maxHi=Math.max(...rows.map(r=>r.hi));
  const wet=rows.reduce((a,r)=>r.p>a.p?r:a,rows[0]);

  const night=rows.find(r=>r.dn===2)||rows[0];
  const notes={};
  notes.p3="預報全程 "+minLo+"°～"+maxHi+"°C。"+(minLo<=-1?"最低溫在 0°C 以下：羽絨外套加發熱衣褲，毛帽、手套、圍巾都要帶。":minLo<=3?"偏冷：羽絨或厚外套加發熱衣，圍巾手套備著。":minLo<=8?"防風外套加毛衣、發熱衣就夠，圍巾備著。":"氣溫比預期暖，可減少厚衣，薄外套加洋蔥式穿搭即可。");
  if(mt.length){
    const ml=Math.min(...mt.map(r=>r.lo)),sn=mt.reduce((a,r)=>a+r.snow,0),mp=Math.max(...mt.map(r=>r.p));
    notes.p4="2/4 伊根・美山預報最低 "+ml+"°C，"+(sn>0?"有降雪（約 "+Math.round(sn*10)/10+" cm）":"降雨／雪機率 "+mp+"%")+"。"+(ml<=1||sn>0?"路面易結冰，防滑鞋必帶。":"路面可能較乾，仍建議防滑底的鞋。");
  }
  const N=night.lo<=0?10:night.lo<=4?8:5;
  notes.p5="2/3 火爐祭夜間戶外 1–2 小時，京都預報最低 "+night.lo+"°C：暖暖包每人至少 "+N+" 片，手套、帽子、圍巾都帶。";
  notes.p6=wet.p>=50?"降雨／降雪機率最高 "+wet.p+"%（"+wet.d+"）：帶防水外套或雨衣，鞋子最好防水。":wet.p>=30?"機率最高 "+wet.p+"%（"+wet.d+"）：帶摺疊傘或輕便雨衣。":"預報降雨機率偏低（最高 "+wet.p+"%），輕便雨衣備著即可。";
  const sum="全程 "+minLo+"°～"+maxHi+"°C；降雨／降雪機率最高 "+wet.p+"%（"+wet.d+"）";
  return{notes,sum};
}

const _plain=t=>String(t).replace(/<[^>]*>/g,"");
function splitSemi(t){ // 以「；」切開，但括號（）內的不切
  const out=[];let d=0,cur="";
  for(const ch of String(t)){
    if(ch==="（"||ch==="(")d++;else if(ch==="）"||ch===")")d=Math.max(0,d-1);
    if(ch==="；"&&d===0){out.push(cur);cur=""}else cur+=ch;
  }
  out.push(cur);return out.map(x=>x.trim()).filter(Boolean);
}
function fmtLk(t){ // 置物櫃：地點粗體、價格換行
  const parts=splitSemi(t).map(x=>x.replace(/[。]$/,""));
  return '<ul class="bl">'+parts.map(x=>{if(/^【.+】$/.test(x))return '<li class="gh"><span>'+x.slice(1,-1)+'</span></li>';const i=x.indexOf("：");return i>0&&i<=22?'<li><b class="lk">'+x.slice(0,i)+'</b><span class="lv">'+x.slice(i+1)+'</span></li>':'<li>'+x+'</li>'}).join("")+'</ul>';
}
function fmt(t){ // 長文字 → 條列（以「；」或多句「。」切開）
  if(t==null)return "";t=String(t);
  if(_plain(t).length<36)return t;
  let parts=splitSemi(t);
  if(parts.length<2){const sn=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(sn.length>=2)parts=sn}
  if(parts.length<2)return t;
  return '<ul class="bl">'+parts.map(x=>'<li>'+x.replace(/[。；]$/,"")+'</li>').join("")+'</ul>';
}
function fmtP(t){ // 說明段落：多句時每句獨立一行
  if(t==null)return "";t=String(t);
  if(_plain(t).length<60)return t;
  const sn=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);
  if(sn.length<2)return t;
  return sn.map(x=>'<span class="ln">'+x+'</span>').join("");
}
function rowVal(label,v){ // 推薦／備案列：店名獨立一行，說明縮小換行
  v=String(v);
  if(/^(推薦|備案|附近推薦)/.test(label)){
    const i=v.indexOf("｜");
    if(i>0)return '<span class="rt">'+v.slice(0,i)+'</span><span class="rd">'+splitSemi(v.slice(i+1)).map(x=>'<span class="ln">'+x.replace(/[。]$/,"")+'</span>').join("")+'</span>';
  }
  if(/置物櫃/.test(label))return fmtLk(v);
  return fmt(v);
}
const EXP={};
function jpName(n,map,jp){
  if(jp)return jp;
  const kana=/[\u3041-\u3096\u30a1-\u30fa]/;
  let t=String(n||"").replace(/^[^｜]*｜/,"");
  for(const m of (t.match(/（[^）]*）/g)||[])){const x=m.slice(1,-1).trim();if(kana.test(x)&&!/^(舊名|旧)/.test(x)&&!/^[A-Za-z0-9 .&'-]+$/.test(x)&&x.length<=30)return x}
  const main=t.replace(/（[^）]*）/g,"").trim();
  if(kana.test(main)&&main.length<=30&&!/[A-Za-z]{4,}/.test(main))return main;

  return "";
}

function resList(){

}
const resGet=id=>resList().find(r=>r.id===id)||null;
function resStat(r){return r.done?["ok","已訂位"]:(r.date?["tbc","待訂位"]:["ex","日期待定"])}
function setRes(id,f,v){
  if(id.charAt(0)==="x"){const r=S.resCustom.find(x=>x.id===id);if(r)r[f]=v}
  else{(S.res[id]=S.res[id]||{})[f]=v}
  save();
  const r=resGet(id),el=$("#rs-"+id);
  if(r&&el){const st=resStat(r);el.className="tg "+st[0];el.textContent=st[1]}
  const row=$("#rc-"+id);if(row)row.classList.toggle("is-done",!!(r&&r.done));
  const L=resList(),c=$("#rcnt");if(c)c.textContent=L.filter(x=>x.done).length+" / "+L.length
}

function resOpenDate(r){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(r.date||"");const o=/(\d+)\s*(個月|週|天)前/.exec(r.open||"");
  if(!m||!o)return null;const y=+m[1],mo=+m[2]-1,d=+m[3],n=+o[1];
  return o[2]==="個月"?new Date(Date.UTC(y,mo-n,/每月|整月/.test(r.open)?1:d)):new Date(Date.UTC(y,mo,d-n*(o[2]==="週"?7:1)));
}
function resSchedHTML(){
  const W=["日","一","二","三","四","五","六"];
  const rows=resList().filter(r=>!r.done).map(r=>({r,od:resOpenDate(r)})).sort((a,b)=>a.od&&b.od?a.od-b.od:a.od?-1:b.od?1:0);
  const t=new Date(),today=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());
  const item=({r,od})=>{
    let when,left="";
    if(od){when=od.getUTCFullYear()+"/"+(od.getUTCMonth()+1)+"/"+od.getUTCDate()+"（"+W[od.getUTCDay()]+"）";
      const dd=Math.round((od-today)/864e5);left=dd>0?'還有 '+dd+' 天':dd===0?'今天開放':'已開放';}
    else when="開放日待填";
    const meal=(r.date?r.date.slice(5).replace("-","/"):"日期待定")+(r.time?" "+r.time:"");
    return '<div class="rv" style="grid-template-columns:1fr"><div><div style="font-weight:700;font-size:17px">📌 '+when+(left?' <span class="tg tbc" style="margin:0 0 0 4px">'+left+'</span>':'')+'</div>'+
      '<div style="font-size:16px">訂 <b>'+esc(r.name)+'</b>（用餐 '+meal+'）</div>'+
      '<div style="font-size:15px;opacity:.85">'+(r.open?esc(r.open):'尚未填開放訂位時間')+'</div></div></div>';
  };
  return '<div class="card"><div class="rv-h"><h3>🗓️ 訂位時程表</h3><span class="tg tbc" style="margin:0">待訂 '+rows.length+' 間</span></div>'+
   '<p style="font-size:15px;margin:2px 0 4px">依「開放訂位」推算的日期由早到晚排列，到時間就去訂；訂好後打勾，會自動從這裡移走。</p>'+
   (rows.length?rows.map(item).join(""):'<p style="padding:10px 0">目前沒有待訂的餐廳 🎉</p>')+'</div>';
}

   '<form class="rv-add" data-res-add="1"><b>新增要預約的餐廳</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:6px"><label style="grid-column:1/-1;font-size:15px">餐廳名稱<input type="text" name="n" maxlength="40" required style="border:var(--line);border-radius:12px;min-height:46px;width:100%;padding:0 10px;font-size:16px;margin-top:2px"></label>'+
   '<label style="font-size:15px">日期<input type="date" name="d" min="2027-02-02" max="2027-02-07" style="border:var(--line);border-radius:12px;min-height:46px;width:100%;padding:0 10px;font-size:16px;margin-top:2px"></label><label style="font-size:15px">時間<input type="time" name="t" style="border:var(--line);border-radius:12px;min-height:46px;width:100%;padding:0 10px;font-size:16px;margin-top:2px"></label>'+
   '<label style="grid-column:1/-1;font-size:15px">開放訂位（選填）<input type="text" name="o" maxlength="40" placeholder="例：1 個月前開放" style="border:var(--line);border-radius:12px;min-height:46px;width:100%;padding:0 10px;font-size:16px;margin-top:2px"></label>'+
   '<label style="grid-column:1/-1;font-size:15px">訂位連結（選填）<input type="url" name="u" maxlength="300" placeholder="貼上訂位網址" style="border:var(--line);border-radius:12px;min-height:46px;width:100%;padding:0 10px;font-size:16px;margin-top:2px" ></label></div>'+
   '<div class="acts"><button class="btn fill" type="submit">＋ 新增</button></div></form></div>';
}
function optHTML(o,j,isPick){
  const r=o.resId?resGet(o.resId):null;
  let rs="";
  if(r){const pt=[];if(r.date)pt.push(r.date.slice(5).replace("-","/"));if(r.time)pt.push(r.time);if(r.no)pt.push(r.no);
    rs='<div class="row"><b>訂位</b><span>'+(pt.length?esc(pt.join("｜")):"尚未填寫，請到「預約」分頁填寫")+'</span></div>'}
  const badges=(o.award?'<span class="tg award">'+o.award+'</span>':'');
  const score=(o.tabelog||o.google)?'<div class="scoreline">'+(o.tabelog?'Tabelog '+o.tabelog:'Tabelog 未查到')+(o.google?'｜Google '+o.google:'')+'</div>':'';
  return '<div class="opt'+(j?'':' f')+'"><h3 class="opt-title">'+o.n+(isPick?PICK_ICON:'')+'</h3>'+(badges?'<div class="opt-badges">'+badges+'</div>':'')+score+
   (o.area?'<div class="row"><b>餐廳資訊</b><span>'+o.area+(o.kind?'｜'+o.kind:'')+'</span></div>':'')+
   (o.dishes?'<div class="row"><b>推薦餐點</b><span>'+fmt(o.dishes)+'</span></div>':'')+
   (o.pp?'<div class="row"><b>人均</b><span>'+o.pp+'</span></div>':'')+rs+
   (o.note?'<div class="row"><b>備註</b><span>'+fmt(o.note)+'</span></div>':'')+
   '<div class="acts">'+(o.map?'<a class="btn" target="_blank" rel="noopener" href="'+mapUrl(o.map)+'">'+IC.map+' 地圖</a>':'')+jpBtn(o.n,o.map,o.jp)+'</div></div>';
}
function slotHTML(sl,i){
  const booked=sl.opts.some(o=>o.resId&&(resGet(o.resId)||{}).done);
  const tag=booked?'<span class="tg ok">已訂位</span>':sl.st==="ok"?'<span class="tg ok">已安排</span>':sl.st==="todo"?'<span class="tg tbc">待訂位</span>':'<span class="tg ex">建議</span>';
  const numericScore=v=>{const m=String(v||"").match(/^\s*(\d+(?:\.\d+)?)/);return m?Number(m[1]):null;};
  let best=-1;
  const manual=sl.opts.map((o,idx)=>o.topPick?idx:-1).filter(idx=>idx>=0);
  if(manual.length===1){
    best=manual[0];
  }else if(sl.opts.length>1){
    const scored=sl.opts.map((o,idx)=>({idx,t:numericScore(o.tabelog),g:numericScore(o.google),award:!!o.award,hasInfo:!!(o.dishes||o.note||o.area)}));
    const comparable=scored.filter(x=>x.t!==null&&x.g!==null);
    if(comparable.length>=2){
      comparable.sort((a,b)=>((b.t+b.g)/2)-((a.t+a.g)/2)||(Number(b.award)-Number(a.award))||(b.t-a.t)||(b.g-a.g));
      best=comparable[0].idx;
    }else if(comparable.length===1){
      best=comparable[0].idx;
    }else{
      scored.sort((a,b)=>{
        const rank=x=>[Number(x.award),Number(x.t!==null&&x.g!==null),Number(x.t!==null||x.g!==null),x.t===null?-1:x.t,x.g===null?-1:x.g,Number(x.hasInfo)];
        const A=rank(a),B=rank(b);for(let k=0;k<A.length;k++){if(A[k]!==B[k])return B[k]-A[k];}return a.idx-b.idx;
      });
      best=scored[0].idx;
    }
  }
  return '<div class="it food pop" style="--i:'+i+'"><div class="top"><span class="time">'+sl.time+'</span><span class="kind">'+sl.slot+'</span>'+tag+'</div>'+
   (sl.note?'<p class="d">'+fmtP(sl.note)+'</p>':'')+sl.opts.map((o,j)=>optHTML(o,j,j===best)).join("")+'</div><div class="gap"></div>';
}
function foodHTML(){
  const n=(S.fday>=0&&S.fday<=6)?S.fday:0;
  let h='<h2 class="stitle">餐廳</h2><p class="d">店家資訊核對：2026/11/24。官方頁面有公開的營業時間與菜單已優先採用；未公開或無法核實的價格、臨時公休與品項均標示為參考／待確認。2027 年出發前仍請看店家公告。</p><div class="days f4"><button class="dbtn all'+(n===0?' on':'')+'" data-fday="0"><b>'+IC.copy+' 預約餐廳</b><span>全部清單</span></button>'+
   DAYS.map(d=>'<button class="dbtn'+(n===d.n?' on':'')+'" data-fday="'+d.n+'"><b>'+d.date+'</b><span>'+d.wd+'・D'+d.n+'</span></button>').join("")+'</div>';
  if(n===0)return h+'<div class="dayhead"><h2>所有預約餐廳</h2></div>'+resAllHTML()+backBtn();
  const D=DAYS[n-1];
  const rl=resList().filter(r=>dayOfDate(r.date)===n).sort((a,b)=>(a.time||"99:99")<(b.time||"99:99")?-1:(a.time||"99:99")>(b.time||"99:99")?1:0);
  h+='<div class="dayhead"><h2>Day '+D.n+'｜'+D.date+'（'+D.wd+'）餐廳</h2></div>'; 
  if(rl.length)h+='<div class="card"><b>📌 當天預約</b>'+rl.map(r=>'<p style="margin:4px 0 0">'+esc(r.name)+(r.time?'｜'+esc(r.time):'')+(r.done?'｜✅ 已訂位':'｜尚未訂位')+(r.no?'｜'+esc(r.no):'')+'</p>').join("")+'</div>';
  h+=(MEALS[n]||[]).map(slotHTML).join("");
  return h+backBtn();
}

/* ---------- 主渲染 ---------- */
function render(){
  const h=parseHash();
  view=["overview","daily","food","list","budget","stay"].includes(h.v)?h.v:"overview";
  if(h.v==="daily"&&h.d>=1&&h.d<=6)S.day=h.d;
  if(h.v==="food")S.fday=(h.d>=0&&h.d<=6)?h.d:0;
  renderNav();
  const c=$("#content");
  c.innerHTML=view==="overview"?ovHTML():view==="daily"?dailyHTML():view==="food"?foodHTML():view==="list"?listHTML():view==="budget"?budgetHTML():stayHTML();
  tick();
}

/* ---------- 事件 ---------- */
document.addEventListener("click",e=>{
  const nmEl=e.target.closest(".rv .nm");if(nmEl&&!e.target.closest("a,button,input")){const cb=nmEl.closest(".rv").querySelector("input[type=checkbox]");if(cb){cb.click();return}}
  const t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.exp){const c=t.closest('.it'),o=!c.classList.contains('open');c.classList.toggle('open',o);EXP[t.dataset.exp]=o;t.textContent=o?'收合 ▴':'展開細節 ▾';t.setAttribute('aria-expanded',o);return}
  if(t.dataset.expall){const cs=[...document.querySelectorAll('#content .it.fold')],all=cs.every(c=>c.classList.contains('open'));cs.forEach(c=>{c.classList.toggle('open',!all);const b=c.querySelector('[data-exp]');if(b){EXP[b.dataset.exp]=!all;b.textContent=!all?'收合 ▴':'展開細節 ▾';b.setAttribute('aria-expanded',!all)}});t.textContent=all?'全部展開 ▾':'全部收合 ▴';return}
  if(t.dataset.jp!==undefined){copyText(decodeURIComponent(t.dataset.jp),t);return}
  if(t.dataset.nav){const b4=location.hash;go(t.dataset.nav);if(location.hash===b4)render();window.scrollTo(0,0);return}
  if(t.dataset.day){S.day=+t.dataset.day;save();go("daily",S.day);return}
  if(t.dataset.fday!==undefined){S.fday=+t.dataset.fday;save();go("food",S.fday);return}
  if(t.dataset.resDel){const id=t.dataset.resDel;if(id.charAt(0)==="x")S.resCustom=S.resCustom.filter(x=>x.id!==id);else S.resRemoved[id]=true;save();render();return}
  if(t.dataset.act==="top"){toMenu();return}
  if(t.dataset.sum){S.sum=!S.sum;save();const D=DAYS[S.day-1];$("#sum").outerHTML=wxHTML(D);return}
  if(t.dataset.wxr){t.textContent='抓取中…';refreshWx(true).then(updSum).catch(()=>{t.textContent='抓取失敗，請稍後再試'});return}
  if(t.dataset.mode){S.mode["d"+S.day]=t.dataset.mode;save();render();return}
  if(t.dataset.ckDel){
    const [cat,id]=t.dataset.ckDel.split(":");
    if(CK[cat]&&CK[cat].some(x=>x.id===id))S.ck.removed[id]=true;
    else S.ck.custom[cat]=(S.ck.custom[cat]||[]).filter(x=>x.id!==id);
    delete S.ck.done[id];save();render();return}
  if(t.dataset.export){exportData();return}
  if(t.dataset.copy){copyData();return}
  if(t.dataset.importTxt){importText($("#impTxt").value);return}
  if(t.dataset.reset){if(confirm("確定要清除這支手機上的所有勾選、花費與清單資料嗎？此動作無法復原。")){S=defState();save();render();}return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.resDone){setRes(t.dataset.resDone,'done',t.checked);const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(t.dataset.ck){S.ck.done[t.dataset.ck]=t.checked;save();render();return}
  if(t.dataset.rate){const v=parseFloat(t.value);if(v>0){S.rate=v;save();render()}return}
  if(t.dataset.importFile&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(t.files[0]);return}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.field){S.fields[t.dataset.field]=t.value;save()}
  if(t.dataset.resF){const a=t.dataset.resF.split(":");setRes(a[0],a[1],t.value)}});
document.addEventListener("submit",e=>{
  const rf=e.target.closest("form[data-res-add]");
  if(rf){e.preventDefault();const n=rf.elements.n.value.trim();if(!n)return;S.resCustom.push({id:"x"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,date:rf.elements.d.value||"",time:rf.elements.t.value||"",url:rf.elements.u.value.trim(),open:rf.elements.o.value.trim(),no:"",note:""});save();render();return}
  const f=e.target.closest("form[data-ck-add]");if(!f)return;e.preventDefault();
  const cat=f.dataset.ckAdd,inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;
  (S.ck.custom[cat]=S.ck.custom[cat]||[]).push({id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:v});
  save();render();
});
window.addEventListener("hashchange",render);

/* ---------- 備份 ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kyoto2027-backup.json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);msg("已匯出備份檔。");
}
function copyData(){
  const s=JSON.stringify(S);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>msg("已複製備份文字，可貼到備忘錄保存。"),()=>msg("複製失敗，請改用匯出備份檔。"))}
  else msg("此瀏覽器不支援複製，請改用匯出備份檔。");
}
function importText(txt){
  try{const j=JSON.parse(txt);if(!j||typeof j!=="object")throw 0;S=normalize(j);save();render();setTimeout(()=>msg("匯入完成。"),50)}
  catch(e){msg("匯入失敗：內容不是有效的備份資料。")}
}
function msg(t){const m=$("#bkMsg");if(m)m.textContent=t}

/* ---------- 啟動 ---------- */
render();
setInterval(tick,30000);
refreshWx().then(()=>{updSum();if(view==='list')render()}).catch(()=>{});
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
